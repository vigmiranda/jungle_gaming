name: wagering

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wagering
      POSTGRES_PASSWORD: wagering
      POSTGRES_DB: wagering
    ports:
      # Portas do host são parametrizáveis para conviver com outros projetos.
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wagering -d wagering"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm", "--http-port=8088"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    ports:
      - "${KEYCLOAK_HOST_PORT:-8088}:8088"
    volumes:
      - ./deploy/keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '\"status\": \"UP\"'",
        ]
      interval: 10s
      timeout: 5s
      retries: 30

  localstack:
    image: localstack/localstack:3
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: us-east-1
      DEBUG: "0"
    ports:
      - "${LOCALSTACK_HOST_PORT:-4566}:4566"
    volumes:
      - ./deploy/localstack/init-queues.sh:/etc/localstack/init/ready.d/init-queues.sh:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "awslocal sqs get-queue-url --queue-name wager-transactions.fifo || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 30

  # As migrations rodam em um serviço próprio, não no start da API: com várias
  # instâncias subindo em paralelo, migrar no boot vira uma corrida.
  migrate:
    build: .
    entrypoint: ["/migrate"]
    command: ["-command", "up"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_DSN: postgres://wagering:wagering@postgres:5432/wagering?sslmode=disable
    restart: "no"

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      APP_ENV: local
      LOG_LEVEL: info
      HTTP_PORT: 8080
      POSTGRES_DSN: postgres://wagering:wagering@postgres:5432/wagering?sslmode=disable
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      SQS_WAGER_QUEUE_URL: http://localstack:4566/000000000000/wager-transactions.fifo
      SQS_WAGER_DLQ_URL: http://localstack:4566/000000000000/wager-transactions-dlq.fifo
      SQS_INTEGRATION_QUEUE_URL: http://localstack:4566/000000000000/wagering-integration-events
      SQS_CONSUMER_ENABLED: "true"
      SQS_CONSUMER_NAME: wager-consumer
      SQS_MAX_MESSAGES: "5"
      SQS_WAIT_TIME: 20s
      SQS_VISIBILITY_TIMEOUT: 30s
      WAGER_ALLOWED_PROVIDERS: provider-a,provider-b
      # O issuer é o hostname externo (o mesmo que aparece no `iss` do token),
      # enquanto o JWKS é buscado pelo nome interno do serviço.
      OIDC_ISSUER_URL: http://localhost:8088/realms/wagering
      OIDC_JWKS_URL: http://keycloak:8088/realms/wagering/protocol/openid-connect/certs
      OIDC_AUDIENCE: wagering-api
    ports:
      - "${API_HOST_PORT:-8080}:8080"

volumes:
  postgres-data:
